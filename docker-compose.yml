# Official Open WebUI (GHCR). Providers: Ollama (host) + cursor-sdk-to-openai (OpenAI-compatible).
# Docs: https://docs.openwebui.com/getting-started/quick-start/connect-a-provider
# Image: https://github.com/open-webui/open-webui/pkgs/container/open-webui
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: maya-openwebui
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-3080}:8080"
    volumes:
      - maya-openwebui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Brand (license appends " (Open WebUI)" when name != default)
      WEBUI_NAME: ${WEBUI_NAME:-Maya}
      # OpenAI-compatible provider = cursor-sdk-to-openai (not headless CLI)
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-true}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://cursor-sdk-to-openai-api-1:8140/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      OPENAI_API_CONFIGS: ${OPENAI_API_CONFIGS}
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA_API:-true}
      # Vector DB = Qdrant (Docker, host publish :6333). Collections are prefixed
      # "<QDRANT_COLLECTION_PREFIX>_<knowledge-id>"; the ERP access dataset lives in
      # the separate "erp_reports" collection (scripts/qdrant_ingest_erp_reports.py).
      VECTOR_DB: ${VECTOR_DB:-qdrant}
      QDRANT_URI: ${QDRANT_URI:-http://host.docker.internal:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-maya}
      QDRANT_ON_DISK: ${QDRANT_ON_DISK:-false}
      # Persian-first corpus: multilingual embeddings, not the English all-MiniLM default.
      # Persisted value lives in webui.db (Admin -> Settings -> Documents); this is the bootstrap default.
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      USE_EMBEDDING_MODEL_DOCKER: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      # Hybrid + CrossEncoder rerank (multilingual MiniLM; download once, then HF_HUB_OFFLINE=1 is fine).
      ENABLE_RAG_HYBRID_SEARCH: ${ENABLE_RAG_HYBRID_SEARCH:-true}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_TOP_K_RERANKER: ${RAG_TOP_K_RERANKER:-5}
      RAG_RELEVANCE_THRESHOLD: ${RAG_RELEVANCE_THRESHOLD:-0.4}
      RAG_RERANKING_MODEL: ${RAG_RERANKING_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      # Embedding models are pre-downloaded into the volume; never wait on huggingface.co at
      # startup or on a model switch (set HF_HUB_OFFLINE=0 in .env to allow fresh downloads).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URLS: ${OLLAMA_BASE_URLS:-http://host.docker.internal:11434;http://10.10.16.118:11434}
      WEBUI_URL: ${WEBUI_URL:-http://maya.local}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-armin@local}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-armin}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-123456}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-cursor-headless-cli-auto}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-maya-local}
    networks:
      - default
      - pc-armin-local

volumes:
  maya-openwebui-data:
    # Stable name so stack rename (maya-local → maya) keeps DB/files on update.
    name: maya-openwebui-data

networks:
  pc-armin-local:
    name: pc-armin-local
    external: true
